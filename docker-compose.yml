name: commit-pulse

services:
  # ---------------------------------------------------------------------------
  # Kafka (KRaft mode - no Zookeeper). Community image, Apache-2.0, free.
  # Two listeners:
  #   INTERNAL (kafka:29092) -> for other containers on this compose network
  #   EXTERNAL (localhost:9092) -> for Python services running on your host
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: cp-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "INTERNAL://kafka:29092,CONTROLLER://kafka:29093,EXTERNAL://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # Single-node: everything must be replication factor 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Creates the raw-commits topic once, then exits. Idempotent.
  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    container_name: cp-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["kafka-topics"]
    command:
      - --bootstrap-server
      - kafka:29092
      - --create
      - --if-not-exists
      - --topic
      - raw-commits
      - --partitions
      - "3"
      - --replication-factor
      - "1"

  # ---------------------------------------------------------------------------
  # MinIO - raw webhook payload archive (source of truth for reprocessing)
  # Console: http://localhost:9001
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: cp-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Creates the bucket once, then exits. Idempotent.
  minio-init:
    image: minio/mc:latest
    container_name: cp-minio-init
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}
      mc mb --ignore-existing local/${MINIO_BUCKET}
      mc ls local
      "

  # ---------------------------------------------------------------------------
  # PostgreSQL is NOT run locally — this project uses Neon (serverless Postgres).
  # Apply the schema once with the DIRECT (unpooled) connection string:
  #   psql "$POSTGRES_DIRECT_URL" -f infra/postgres/01-schema.sql
  # See README for why direct vs pooled matters.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # ClickHouse - time-series / aggregate metrics
  # HTTP: 8123, native: 9010 (9000 is taken by MinIO on the host)
  # ---------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: cp-clickhouse
    ports:
      - "8123:8123"
      - "9010:9000"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # Runs only on FIRST start (when the data volume is empty)
      - ./infra/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # ChromaDB - vector store for semantic search over commit messages/diffs
  # ---------------------------------------------------------------------------
  chroma:
    image: chromadb/chroma:latest
    container_name: cp-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/data
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "cat < /dev/null > /dev/tcp/localhost/8000"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Webhook receiver - GitHub push events -> HMAC verify -> Kafka raw-commits.
  # Expose it through a tunnel (e.g. smee.io) when wiring a real GitHub webhook.
  # ---------------------------------------------------------------------------
  webhook:
    image: commit-pulse-app:latest
    build:
      context: .
    container_name: cp-webhook
    depends_on:
      kafka:
        condition: service_healthy
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    working_dir: /app
    command: uvicorn services.webhook:create_app --factory --host 0.0.0.0 --port 8000
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Stream processor - Kafka consumer -> diff enrichment -> 4 sinks.
  # Image: build once with `docker build -t commit-pulse-app .` (or compose --build).
  # Code is bind-mounted so edits apply on restart without a rebuild.
  # NOTE: compose strips quotes from .env values (docker run --env-file does NOT) —
  # the quoted POSTGRES_POOLED_URL is safe here.
  # ---------------------------------------------------------------------------
  processor:
    image: commit-pulse-app:latest
    build:
      context: .
    container_name: cp-processor
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      chroma:
        condition: service_healthy
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MINIO_ENDPOINT: http://minio:9000
      CLICKHOUSE_HOST: clickhouse
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
    volumes:
      - ./:/app
    working_dir: /app
    command: python -m services.processor
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # AI chat backend - POST /chat: LLM router -> safe query execution -> answer.
  # Host port 8002 -> container 8000 (8000 on the host is the webhook receiver).
  # ---------------------------------------------------------------------------
  chat:
    image: commit-pulse-app:latest
    build:
      context: .
    container_name: cp-chat
    depends_on:
      clickhouse:
        condition: service_healthy
      chroma:
        condition: service_healthy
    env_file:
      - .env
    environment:
      CLICKHOUSE_HOST: clickhouse
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      PYTHONPATH: /app
    ports:
      - "8002:8000"
    volumes:
      - ./:/app
    working_dir: /app
    command: uvicorn services.chat:create_app --factory --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Streamlit dashboard - chat UI + routing transparency + ClickHouse chart.
  # Talks to the chat backend over the compose network (CHAT_API_URL).
  # ---------------------------------------------------------------------------
  dashboard:
    image: commit-pulse-app:latest
    build:
      context: .
    container_name: cp-dashboard
    depends_on:
      chat:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    env_file:
      - .env
    environment:
      CHAT_API_URL: http://chat:8000
      CLICKHOUSE_HOST: clickhouse
      PYTHONPATH: /app
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
    working_dir: /app
    command: streamlit run services/dashboard.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    restart: unless-stopped

volumes:
  kafka-data:
  minio-data:
  clickhouse-data:
  chroma-data:
